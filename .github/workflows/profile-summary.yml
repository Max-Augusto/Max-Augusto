name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Generate GitHub Cards
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
      
      - name: Clear old profile cards cache
        run: |
          rm -rf profile-summary-card-output || true
          git add . || true
          git commit -m "chore: clear profile cards cache" || true
      
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        name: Generate Summary Cards
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: -3
          THEME: tokyonight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Remove "Most Used Languages" card
        run: |
          python3 << 'EOF'
          import os
          import re
          
          # Remove the card file (usually 0-profile-details.svg or 1-repos-per-language.svg contains the most used languages)
          card_path = "profile-summary-card-output/tokyonight/0-profile-details.svg"
          
          # Update README to remove the most-used-languages reference
          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Remove any lines containing "Most Used Languages" or profile-summary images that show it
              content = re.sub(
                  r'.*(?:Most Used Languages|profile-summary-card).*\n',
                  '',
                  content,
                  flags=re.IGNORECASE
              )
              
              with open(readme_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("✅ Removed Most Used Languages references from README")
          EOF
      
      - name: Push changes with retry
        run: |
          git fetch origin main
          git add .
          
          if ! git diff --cached --exit-code > /dev/null; then
            git commit -m "chore: update profile cards" || true
            for i in {1..3}; do
              if git push origin main; then
                echo "Push successful!"
                exit 0
              else
                echo "Push attempt $i failed, retrying..."
                sleep 2
                git pull --rebase origin main || true
              fi
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
